name: Post verified changes to X

on:
  schedule:
    - cron: "0 14 * * *"   # once a day, 14:00 UTC -- steady and cheap, no manual posting needed
  workflow_dispatch: {}     # "Run workflow" button to post the next item immediately

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Post the next unposted item in the queue (at most one; a thread counts as one)
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python x-poster/post_to_x.py
      - name: Save which entry was posted
        run: |
          git config user.name "diplonaut-monitor"
          git config user.email "monitor@users.noreply.github.com"
          git add x-poster/queue.json
          git commit -m "Post to X: $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "Nothing to commit"
          git push
